[project]
name = "investing-demo"
version = "1.0.0"
description = "Investing Demo — учебный инвестиционный дашборд (Django + DRF + Celery + Tinkoff Invest API)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<3.17",
    "django-filter>=25.1,<26.0",
    "django-crispy-forms>=2.4,<3.0",
    "crispy-bootstrap3>=2024.1,<2026.0",
    "celery>=5.5,<6.0",
    "redis>=5.0,<7.0",
    "psycopg2-binary>=2.9.10,<3.0",
    "plotly>=5.24,<7.0",
    "tinkoff-investments",
    "python-dotenv>=1.0,<2.0",
    "black>=25.0,<26.0",
    "isort>=6.0,<7.0",
]

[tool.black]
line-length = 79
extend-exclude = "vendor|.venv|dashboard/migrations|dashboard/models.py|dashboard/api/v1/views.py"
force-exclude = true

[tool.isort]
profile = "black"
line_length = 79
skip = ["vendor", ".venv", "node_modules"]
skip_glob = ["**/migrations/*"]

[tool.uv.sources]
tinkoff-investments = { path = "vendor/tinkoff-investments" }
