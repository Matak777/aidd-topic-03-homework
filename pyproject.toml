[project]
name = "investing-demo"
version = "0.1.0"
description = "Investing Demo Django application"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=5.2,<5.3",
    "celery[redis]>=5.6,<5.7",
    "crispy-bootstrap3>=2024.1,<2025",
    "deprecation>=2.1,<3",
    "django-crispy-forms>=2.4,<3",
    "django-filter>=25.2,<27",
    "djangorestframework>=3.18,<3.19",
    "grpcio>=1.70,<2",
    "plotly>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "protobuf>=4.25,<5",
    "python-dotenv>=1.1,<2",
    "python-dateutil>=2.9,<3",
    "cachetools>=5.2,<6",
    "tinkoff-investments==0.2.0b59",
]

[tool.uv]
package = false

[tool.uv.sources]
tinkoff-investments = { path = "vendor/tinkoff-investments", editable = false }
