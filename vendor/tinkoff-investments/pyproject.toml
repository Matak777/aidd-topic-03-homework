[project]
name = "tinkoff-investments"
version = "0.2.0-beta50"
description = "Tinkoff Invest API Python gRPC client (vendored from Tinkoff/invest-python @0.2.0-beta50; удалён из PyPI)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "cachetools>=5.2,<7.0",
    "grpcio>=1.48,<2.0",
    "protobuf>=4.21.6,<5.0",
    "python-dateutil>=2.8.2,<3.0",
    "pydantic>=1.10,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinkoff"]
